name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The runner has Docker, but the default suite must not need it.
      # Pointing DOCKER_HOST at nothing makes any reach for a container
      # fail here rather than in a consumer's checkout.
      - name: Test
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
        run: go test -race -count=1 ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Build tags are additive, so this runs the default suite too, plus
      # the tagged suite that stands up a real Vault via testcontainers.
      # It has a container image to pull, so it gets longer than the
      # default ten minutes.
      - name: Test
        run: go test -tags integration -race -count=1 -timeout 15m ./...
